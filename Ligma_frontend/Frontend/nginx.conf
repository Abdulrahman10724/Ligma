server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets
    location /assets/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # React Router (client-side routing) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend container over the internal Docker
    # network (service name "backend"). The app's own client code already
    # defaults to calling the backend on the published host port, so this
    # proxy is provided for service-to-service routing/robustness and for
    # deployments that prefer same-origin requests.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
